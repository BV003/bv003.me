name: Sync new posts to Substack

on:
  push:
    branches: [main]
    paths: ['src/content/blog/**']
  workflow_dispatch:

concurrency:
  group: substack-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install CJK fonts for cover images
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Publish new posts (with email) and sync edits (no email)
        env:
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
        run: node scripts/substack-sync.mjs --publish --send-email --sync-edits
      - name: Commit ledger
        if: always()
        run: |
          if git diff --quiet -- substack-sync.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack-sync.json
          git commit -m "chore: update substack-sync ledger [skip ci]"
          git pull --rebase
          git push
